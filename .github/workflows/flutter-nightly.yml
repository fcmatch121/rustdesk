name: Flutter Nightly Build

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:
    # Modified: allow a light iteration build (windows-x86_64 only) during development
    inputs:
      build-scope:
        description: "Build scope (all = every platform, windows-x86_64 = quick iteration build)"
        type: choice
        options:
          - all
          - windows-x86_64
        default: all
      custom-server:
        description: "Custom rendezvous server (IP/domain) to bake into the agent"
        type: string
        default: ""
      custom-pub-key:
        description: "Custom server public key to bake into the agent"
        type: string
        default: ""
      preset-password:
        description: "Preset permanent password baked into the agent (empty = none)"
        type: string
        default: ""
      conn-type:
        description: "Hard conn-type bake: 'outgoing' = viewer-only build (no hbbs registration, no incoming service)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      build-scope: ${{ inputs.build-scope || 'all' }}
      custom-server: ${{ inputs.custom-server || '' }}
      custom-pub-key: ${{ inputs.custom-pub-key || '' }}
      preset-password: ${{ inputs.preset-password || '' }}
      conn-type: ${{ inputs.conn-type || '' }}
